# dots のカスタムコマンド。dots cmd <名前> [引数] で実行する（dots cmd list で一覧）
#   run:     実行するコマンド（sh）。1行で $1 などを使っていなければ、引数は末尾に付く
#            複数行や $1 / "$@" / "$*" を使うときは、引数の位置を自分で決める
#   desc:    一覧に出す説明
#   dir:     実行場所。root = dotfiles（既定）/ cwd = 今いる場所
#   confirm: true なら実行前に確認する（-y で省略）
# 使える環境変数: $DOTS_ROOT（dotfiles のパス）/ $DOTS_PWD（dots を実行した場所）
# list / ls / add / rm / remove は予約名なので使えない

[cmd.status]
desc = "未コミットの変更と未 push のコミットを表示"
run = '''
git status -sb
if git rev-parse @{u} >/dev/null 2>&1; then
  c=$(git log --oneline @{u}..HEAD)
  if [ -n "$c" ]; then printf '\n未 push:\n%s\n' "$c"; fi
fi
'''

[cmd.commit]
desc = "差分を確認してコミット（dots cmd commit メッセージ）"
run = '''
if [ $# -eq 0 ]; then echo "usage: dots cmd commit <メッセージ>" >&2; exit 1; fi
if [ -z "$(git status --porcelain)" ]; then echo "dotfiles に変更はありません"; exit 0; fi
git status --short
git diff
printf 'この内容でコミットしますか? [y/N] '; read a
case "$a" in y|Y|yes) ;; *) echo "コミットしませんでした"; exit 1 ;; esac
git add -A && git commit -m "$*"
'''

[cmd.push]
desc = "未 push のコミットを確認して push"
run = '''
st=$(git status --short)
if [ -n "$st" ]; then printf '未コミットの変更があります（push されません）\n%s\n' "$st"; fi
if ! git rev-parse @{u} >/dev/null 2>&1; then
  printf 'upstream がありません。origin に push しますか? [y/N] '; read a
  case "$a" in y|Y|yes) exec git push -u origin HEAD ;; *) echo "push しませんでした"; exit 1 ;; esac
fi
c=$(git log --oneline @{u}..HEAD)
if [ -z "$c" ]; then echo "push するコミットはありません"; exit 0; fi
echo "$c"
printf 'これらのコミットを push しますか? [y/N] '; read a
case "$a" in y|Y|yes) exec git push ;; *) echo "push しませんでした"; exit 1 ;; esac
'''

[cmd.pull]
desc = "リモートの変更を取り込む（反映は dots install）"
run = '''
before=$(git rev-parse HEAD)
git pull --ff-only || exit
if [ "$before" != "$(git rev-parse HEAD)" ]; then printf '\n反映するには dots install\n'; fi
'''

[cmd.sync]
desc = "pull してから dots install"
run = '''
git pull --ff-only || exit
echo
exec "$DOTS_ROOT/scripts/install.sh"
'''

[cmd.diff]
run = "git diff"
desc = "差分を表示"

[cmd.log]
run = "git log --oneline -10"
desc = "最近のコミット"
